[project]
name = "posiq"
version = "0.1.0"
description = "posiq.: mide la visibilidad de una marca en asistentes de IA y propone un plan de acción."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "langgraph>=1",
    "langgraph-checkpoint-sqlite",
    "openai",
    "typesafe-sdk",
    "system-one-adapter",
    "sqlmodel",
    "pandas",
    "python-docx",
    "docxtpl",
    "pyyaml",
    "httpx",
    "langfuse",
    "google-genai>=2.31.0",
    "anthropic>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", "data", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true

# strict solo en el dominio (el flag `strict` no se admite por módulo: se expanden sus opciones)
[[tool.mypy.overrides]]
module = "posiq.domain.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
